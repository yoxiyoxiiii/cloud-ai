server:
  port: 9202

spring:
  application:
    name: cloud-system
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/cloud_system?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
      # 共享配置接线（2026-10-09 xxl-job 整合设计 D6）：公共项 cloud-common.yaml，optional 容缺向后安全
      - optional:nacos:cloud-common.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    # Feign 降级与超时（设计 D5/D6——架构口径进仓库；translate 程序式 Builder 超时优先级更高不受影响）
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 5000
    # TimeLimiter 默认 1s 会截短 read 5s（设计 D3 陷阱）：Feign 已有自身超时，双层冗余关闭之
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# RocketMQ（契约 2026-10-09 §1.1）——连接配置走 Nacos 不进仓库（cloud-system.yaml 增：
#   rocketmq.name-server: 127.0.0.1:9876
#   rocketmq.producer.group: p_system_tx               # 事务半消息生产组（TX_APPROVAL_CREATE）
# 消费组 g_system_approval_event 经下方 cloud.bpmn.projection.consumer-group 注入（占位符解析）；
# name-server 未配置时 RocketMQTemplate 不装配，MQ 生产/消费 bean 启动即缺——本地起服前先核对 Nacos。

# xxl-job 分布式调度（cloud-common-xxljob-starter，2026-10-09 整合）——连接配置走 Nacos 不进仓库：
#   共享 cloud-common.yaml: xxl.job.admin.addresses / executor.logpath / logretentiondays
#   cloud-system.yaml: cloud.common.xxljob.enabled=true
#                      xxl.job.executor.{appname=cloud-system, port=19202, ip|address=D5 采纳值, accessToken}
# enabled 未配（默认关）时 starter 零装配——admin 容器未起不阻断服务启动。

# 审批状态本地投影（契约 2026-10-09-approval-projection-api §1.1 / 设计 D3）：
# 引 cloud-bpmn-api jar 即得唯一事件监听对象 + 定时对账，两行配置显式启用（默认关防提供方误装配）；
# 消费组名沿用 Round D 组名 g_system_approval_event——broker offset 延续无重放（设计 D3 硬约束）
cloud:
  bpmn:
    projection:
      enabled: true
      consumer-group: g_system_approval_event
      # 对账单批上限用默认（100，对齐平台 status-list 单批上限）；定时轮次节奏自 2026-10-10 起
      # 由 xxl-job admin 任务 id 7 CRON 每分钟 0 * * * * ? 调度（reconcile-interval-ms 键退役——Nacos 从未显式配置，占位符默认即节奏）

mybatis-plus:
  configuration:
    # XML resultType 实体映射依赖驼峰映射；MP 默认开启，此处显式声明防将来配置漂移静默断列
    map-underscore-to-camel-case: true
