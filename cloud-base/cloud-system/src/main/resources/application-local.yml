# 本地离线配置：backup_nacos_config.py 从 Nacos 备份自动生成，勿手改勿提交（含密钥真值）。
# 默认启动即带 local（见 scripts/dev-services.sh 与 CLAUDE.md）——local = 离线模式：
# 不 import Nacos 配置、不注册 Nacos 服务发现，lb:// 走本文件末尾静态实例表。
# 改 Nacos 配置后由启动脚本在下次启动自动重生成本文件；不带 local 启动 = 传统路径。
cloud:
  jwt:
    secret: a68fe7c59f21705f278d4353f56b1a3c19a059123dcca289e15bcbc9749edcea
    access-token-ttl: 7200
    refresh-token-ttl: 604800
xxl:
  job:
    admin:
      addresses: http://127.0.0.1:18081
    executor:
      logpath: D:/applogs/xxl-job
      logretentiondays: 30
---
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: p_system_tx
cloud:
  mcp:
    client-secret: 62170a25dfd007854c32ff3be1eefe70eb58d84cac1fcf8aacb9ef8882e42e51
  common:
    xxljob:
      enabled: true
  inner:
    shared-secret: fsfj/V1LMmJiXlXRxcUpKPfel2ZSdwlJV1P8QaOQykY=
    rotation:
      validity-hours: 168
      overlap-seconds: 180
      lead-hours: 24
xxl:
