server:
  port: 9203

spring:
  application:
    name: cloud-bpmn
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}

management:
  endpoints:
    web:
      exposure:
        include: health,info

mybatis-plus:
  configuration:
    # XML resultType 实体映射依赖驼峰映射；MP 默认开启，此处显式声明防将来配置漂移静默断列（三胞胎同款）
    map-underscore-to-camel-case: true
