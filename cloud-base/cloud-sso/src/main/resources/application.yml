server:
  port: 9201

spring:
  application:
    name: cloud-sso
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        namespace: public

management:
  endpoints:
    web:
      exposure:
        include: health,info
