server:
  port: 18080

spring:
  application:
    name: cloud-gateway
  config:
    import:
      - optional:nacos:cloud-common.yaml
      - optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      routes:
        - id: inner-block-sso
          uri: no://op
          predicates:
            - Path=/sso/inner/**
          filters:
            - SetStatus=403
        - id: inner-block-system
          uri: no://op
          predicates:
            - Path=/system/inner/**
          filters:
            - SetStatus=403
        - id: inner-block-bpmn
          uri: no://op
          predicates:
            - Path=/bpmn/inner/**
          filters:
            - SetStatus=403
        # MCP 面屏蔽（契约 2026-10-17-mcp-tools-api §1.1）：AI 基座直连服务端口，不外露网关
        - id: mcp-block-system
          uri: no://op
          predicates:
            - Path=/system/mcp/**
          filters:
            - SetStatus=403
        # RAG MCP 面屏蔽（契约 2026-11-13-rag-mcp-tools-api §1.1）：agent 侧直连 8011，不外露网关
        - id: mcp-block-ai-rag
          uri: no://op
          predicates:
            - Path=/ai/rag/mcp/**
          filters:
            - SetStatus=403
        # 任务提交面屏蔽（契约 2026-11-10-task-center-api §1）：/inner/task 仅服务间共享密钥面
        - id: inner-block-task
          uri: no://op
          predicates:
            - Path=/task/inner/**
          filters:
            - SetStatus=403
        - id: cloud-sso
          uri: lb://cloud-sso
          predicates:
            - Path=/sso/**
          filters:
            - StripPrefix=1
        - id: cloud-system
          uri: lb://cloud-system
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=1
        - id: cloud-bpmn
          uri: lb://cloud-bpmn
          predicates:
            - Path=/bpmn/**
          filters:
            - StripPrefix=1
        - id: cloud-task
          uri: lb://cloud-task
          predicates:
            - Path=/task/**
          filters:
            - StripPrefix=1
        # AI 基座双服务拆分（2026-11-13）：/ai 首段按域路由——rag 域知识检索、
        # agent 域编排 + MCP server 注册表；前端三组路径（/ai/rag|agent|mcp）零改动
        - id: ai-rag
          uri: lb://cloud-base-rag
          predicates:
            - Path=/ai/rag/**
          filters:
            - StripPrefix=1
        - id: ai-agent
          uri: lb://cloud-base-agent
          predicates:
            - Path=/ai/agent/**,/ai/mcp/**
          filters:
            - StripPrefix=1
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info
