server:
  port: 9202

spring:
  application:
    name: cloud-system
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/cloud_system?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    # Feign 降级与超时（设计 D5/D6——架构口径进仓库；translate 程序式 Builder 超时优先级更高不受影响）
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 5000
    # TimeLimiter 默认 1s 会截短 read 5s（设计 D3 陷阱）：Feign 已有自身超时，双层冗余关闭之
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# RocketMQ（契约 2026-10-09 §1.1）——连接配置走 Nacos 不进仓库（cloud-system.yaml 增：
#   rocketmq.name-server: 127.0.0.1:9876
#   rocketmq.producer.group: p_system_tx               # 事务半消息生产组（TX_APPROVAL_CREATE）
# 消费组 g_system_approval_event 由 @RocketMQMessageListener 注解自持无需配置；
# name-server 未配置时 RocketMQTemplate 不装配，MQ 生产/消费 bean 启动即缺——本地起服前先核对 Nacos）。

mybatis-plus:
  configuration:
    # XML resultType 实体映射依赖驼峰映射；MP 默认开启，此处显式声明防将来配置漂移静默断列
    map-underscore-to-camel-case: true
