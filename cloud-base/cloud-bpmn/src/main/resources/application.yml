server:
  port: 9203

spring:
  application:
    name: cloud-bpmn
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    # Feign 降级与超时（设计 D5/D6——架构口径进仓库；translate 程序式 Builder 超时优先级更高不受影响）
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 5000
    # TimeLimiter 默认 1s 会截短 read 5s（设计 D3 陷阱）：Feign 已有自身超时，双层冗余关闭之
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true
  servlet:
    multipart:
      # multipart 大小上限三段式第 2 段（契约 2026-10-08 §2.2 / 设计 D4）：解析层只兜 ≥3MB/4MB 极端值，
      # 异常经本地 MultipartLimitExceptionHandler 归口 4009。定夺：与 2MB 业务上限强绑定跟代码走，
      # 本地配置不进 Nacos；Boot 默认 1MB 会使 1-2MB 合法文件死在解析层且非 4009 形态。
      max-file-size: 3MB
      max-request-size: 4MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

mybatis-plus:
  configuration:
    # XML resultType 实体映射依赖驼峰映射；MP 默认开启，此处显式声明防将来配置漂移静默断列（三胞胎同款）
    map-underscore-to-camel-case: true
