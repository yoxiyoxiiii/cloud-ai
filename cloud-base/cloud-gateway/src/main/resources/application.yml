server:
  port: 18080

spring:
  application:
    name: cloud-gateway
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      routes:
        - id: inner-block-sso
          uri: no://op
          predicates:
            - Path=/sso/inner/**
          filters:
            - SetStatus=403
        - id: inner-block-system
          uri: no://op
          predicates:
            - Path=/system/inner/**
          filters:
            - SetStatus=403
        - id: inner-block-bpmn
          uri: no://op
          predicates:
            - Path=/bpmn/inner/**
          filters:
            - SetStatus=403
        # MCP 面屏蔽（契约 2026-10-17-mcp-tools-api §1.1）：AI 基座直连服务端口，不外露网关
        - id: mcp-block-system
          uri: no://op
          predicates:
            - Path=/system/mcp/**
          filters:
            - SetStatus=403
        # RAG MCP 面屏蔽（契约 2026-11-13-rag-mcp-tools-api §1.1）：agent 侧直连 8011，不外露网关
        - id: mcp-block-ai-rag
          uri: no://op
          predicates:
            - Path=/ai/rag/mcp/**
          filters:
            - SetStatus=403
        # 任务提交面屏蔽（契约 2026-11-10-task-center-api §1）：/inner/task 仅服务间共享密钥面
        - id: inner-block-task
          uri: no://op
          predicates:
            - Path=/task/inner/**
          filters:
            - SetStatus=403
        - id: cloud-sso
          uri: lb://cloud-sso
          predicates:
            - Path=/sso/**
          filters:
            - StripPrefix=1
        - id: cloud-system
          uri: lb://cloud-system
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=1
        - id: cloud-bpmn
          uri: lb://cloud-bpmn
          predicates:
            - Path=/bpmn/**
          filters:
            - StripPrefix=1
        - id: cloud-task
          uri: lb://cloud-task
          predicates:
            - Path=/task/**
          filters:
            - StripPrefix=1
        # 纯读聚合服务（契约 2026-11-14-aggregate-workbench-api §6）：工作台三段单请求出口
        - id: cloud-aggregate
          uri: lb://cloud-aggregate
          predicates:
            - Path=/aggregate/**
          filters:
            - StripPrefix=1
        # AI 基座双服务拆分（2026-11-13）：/ai 首段按域路由——rag 域知识检索、
        # agent 域编排 + MCP server 注册表；前端三组路径（/ai/rag|agent|mcp）零改动
        - id: ai-rag
          uri: lb://cloud-base-rag
          predicates:
            - Path=/ai/rag/**
          filters:
            - StripPrefix=1
        - id: ai-agent
          uri: lb://cloud-base-agent
          predicates:
            - Path=/ai/agent/**,/ai/mcp/**
          filters:
            - StripPrefix=1
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 网关鉴权白名单（AuthGlobalFilter 放行，startsWith 前缀匹配）：登录/刷新、demo、
# inner 与 MCP 屏蔽（SetStatus 路由接管）、网关自身监控。
# 固化在本文件随 jar 打包、刻意不进 Nacos——白名单是安全边界不开放热改；Nacos import
# 优先级高于包内 yml，云上误配同名键会静默覆盖，以本文件为唯一真相源。
# inner 各项带尾斜杠做段感知匹配——否则 startsWith 会误吞同级前缀路径
# （如 /system/inner-secret/** 管理端点会被跳过鉴权）；MCP 屏蔽项无尾斜杠
# （同 /system/mcp 先例）：rag 域无 /mcp 同级前缀兄弟路径，无误吞面；
# 白名单使屏蔽路由跳过 JWT 鉴权——未带凭证请求也得 403 而非 401，屏蔽语义稳定。
cloud:
  gateway:
    auth:
      whitelist:
        - /sso/auth/login
        - /sso/auth/refresh
        - /sso/demo
        - /system/demo
        - /bpmn/demo
        - /task/demo
        - /aggregate/demo
        - /sso/inner/
        - /system/inner/
        - /bpmn/inner/
        - /task/inner/
        - /system/mcp
        - /ai/rag/mcp
        - /actuator

# Nacos 配置 import 门控：local 激活时跳过 import（本地离线模式——配置取备份脚本生成的
# application-local.yml，从本 src/main/resources 目录启动才命中 file:./ 搜索位，不触碰 Nacos；
# 网关无服务专属 dataId，仅消费 cloud-common.yaml）；非 local 启动照常从 Nacos 拉取。
---
spring:
  config:
    activate:
      on-profile: "!local"
    import:
      - optional:nacos:cloud-common.yaml
      - optional:nacos:${spring.application.name}.yaml
