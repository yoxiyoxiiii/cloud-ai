[project]
name = "cloud-base-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jiangyan", email = "your_new_email@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.20.0",
    "deepagents>=0.7.23",
    "fastapi[standard]>=0.143.0",
    "langchain>=1.4.4",
    "langchain-classic>=1.0.8",
    "langchain-milvus>=0.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "minio>=7.2",
    "nacos-sdk-python>=3.2.0",
    "pdfmuse>=0.1.12",
    "pymysql>=1.2.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
]

[project.scripts]
cloud-base-ai = "cloud_base_ai:main"

[tool.fastapi]
entrypoint = "cloud_base_ai.main:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
]
