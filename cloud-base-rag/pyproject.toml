[project]
name = "cloud-base-rag"
version = "0.1.0"
description = "RAG 服务（:8011）：知识库/检索增强问答管线 + rag_search_kb MCP 工具，依赖共享底座 cloud-ai-common（path dependency）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cloud-ai-common",
    "fastapi[standard]>=0.143.0",
    "fastmcp>=4.1.0",
    "langchain>=1.4.4",
    "langchain-milvus>=0.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "minio>=7.2",
    "pdfmuse>=0.1.12",
]

[tool.uv.sources]
cloud-ai-common = { path = "../cloud-ai-common", editable = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
]
